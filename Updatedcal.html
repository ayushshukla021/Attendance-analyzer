<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Analyzer</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="styleindex.css">

    <style>

       
    </style>
</head>


<body>




    <header class="bg-dark text-white p-3">

        <h1 class="text-center mb-0">
            Attendance Analyzer
        </h1>

    </header>



 

    <div class="container">

        <div class="calculator-card">

            <h2>
                Calculate Attendance
            </h2>


            
            <form id="attendanceForm">


             
                <label for="required" class="form-label">
                    Percentage Required
                </label>

                <select id="required" class="form-select">

                    <option value="75">75%</option>
                    <option value="80">80%</option>
                    <option value="85">85%</option>
                    <option value="90">90%</option>

                </select>




                <label for="totlectures" class="form-label">
                    Total Lectures
                </label>

                <input
                    type="number"
                    id="totlectures"
                    class="form-control"
                    placeholder="Enter total lectures"
                    min="1"
                >



                <label for="absent" class="form-label">
                    Absent Lectures
                </label>

                <input
                    type="number"
                    id="absent"
                    class="form-control"
                    placeholder="Enter absent lectures"
                    min="0"
                >


                <button
                    type="submit"
                    class="btn btn-dark calculate-btn">

                    Calculate Attendance

                </button>

            </form>




            <div id="result">



                <div class="row g-3">


                    <div class="col-6">
                        <div class="result-card">
                            <h6>
                                Current Attendance
                            </h6>
                            <h3 id="currentPercentage">
                                0%
                            </h3>
                        </div>
                    </div>





                    <div class="col-6">
                        <div class="result-card">
                            <h6>
                                Required
                            </h6>

                            <h3 id="requiredPercentage">
                                75%
                            </h3>
                        </div>
                    </div>



                    <!-- Attended -->

                    <div class="col-6">
                        <div class="result-card">
                            <h6>
                                Attended
                            </h6>

                            <h3 id="attendedLectures">
                                0
                            </h3>
                        </div>
                    </div>




                    <div class="col-6">
                        <div class="result-card">
                            <h6>
                                Absent
                            </h6>

                            <h3 id="absentLectures">
                                0
                            </h3>
                        </div>
                    </div>
                </div>



                <!-- PROGRESS BAR -->

                <div class="progress-container">
                    <div class="d-flex justify-content-between mb-2">
                        <span>
                            Attendance Progress
                        </span>

                        <strong id="progressText">
                            0%
                        </strong>
                    </div>


                    <div class="progress">
                        <div
                            id="progressBar"
                            class="progress-bar bg-dark"
                            role="progressbar"
                            style="width: 0%">

                        </div>
                    </div>
                </div>



                <div id="status" class="status">

                </div>

                <!-- WHAT IF CALCULATOR -->

<div class="what-if">

    <h4>🔮 What If?</h4>

    <p>
        See what your attendance will become if you attend or miss
        future lectures.
    </p>

    <div class="row g-3">

        <div class="col-6">

            <label class="form-label">
                Future Attended
            </label>

            <input
                type="number"
                id="futureAttended"
                class="form-control"
                placeholder="0"
                min="0"
            >

        </div>

        <div class="col-6">

            <label class="form-label">
                Future Absent
            </label>

            <input
                type="number"
                id="futureAbsent"
                class="form-control"
                placeholder="0"
                min="0"
            >

        </div>

    </div>

    <button
        type="button"
        id="whatIfBtn"
        class="btn btn-outline-light w-100 mt-3">

        Calculate What If

    </button>


    <div
        id="whatIfResult"
        class="what-if-result">

    </div>

</div>


            </div>
        </div>
    </div>



  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>





    <script>

        const form = document.getElementById("attendanceForm");


        form.addEventListener("submit", function(event) {

            event.preventDefault();


            // Get values

            const required =
                Number(document.getElementById("required").value);

            const total =
                Number(document.getElementById("totlectures").value);

            const absent =
                Number(document.getElementById("absent").value);


            // Validation

            if (total <= 0) {

                alert("Please enter total lectures.");

                return;

            }


            if (absent < 0 || absent > total) {

                alert("Absent lectures cannot be greater than total lectures.");

                return;

            }


            // Calculate attended

            const attended = total - absent;


            // Calculate percentage

            const percentage =
                (attended / total) * 100;


            // Show result

            document.getElementById("result").style.display = "block";


            // Update cards

            document.getElementById("currentPercentage").innerText =
                percentage.toFixed(2) + "%";


            document.getElementById("requiredPercentage").innerText =
                required + "%";


            document.getElementById("attendedLectures").innerText =
                attended;


            document.getElementById("absentLectures").innerText =
                absent;


            // Progress bar

            const progressBar =
                document.getElementById("progressBar");

            const progressText =
                document.getElementById("progressText");


            // not let progress bar go above 100%

            const progressWidth =
                Math.min(percentage, 100);


            progressBar.style.width =
                progressWidth + "%";


            progressText.innerText =
                percentage.toFixed(2) + "%";



            // STATUS

            const status =
                document.getElementById("status");



            // enough attendance

            if (percentage >= required) {


                // lectures that can be missed

                let canMiss = 0;


                while (
                    (attended / (total + canMiss + 1)) * 100
                    >= required
                ) {

                    canMiss++;

                }


                status.className =
                    "status alert alert-success";


                status.innerHTML = `

                    <h5>
                        ✓ Attendance is safe
                    </h5>

                    <p class="mb-0">

                        You can miss

                        <strong>
                            ${canMiss}
                        </strong>

                        more lecture(s) and still maintain

                        <strong>
                            ${required}%
                        </strong>

                        attendance.

                    </p>

                `;

            }



            // Attendance below required

            else {


                // Calculate lectures required

                let needToAttend = 0;


                while (
                    ((attended + needToAttend) /
                    (total + needToAttend)) * 100
                    < required
                ) {

                    needToAttend++;

                }


                status.className =
                    "status alert alert-danger";


                status.innerHTML = `

                    <h5>
                        ⚠ Attendance is below ${required}%
                    </h5>

                    <p class="mb-0">

                        You need to attend

                        <strong>
                            ${needToAttend}
                        </strong>

                        consecutive lecture(s)

                        to reach

                        <strong>
                            ${required}%
                        </strong>.

                    </p>

                `;

            }

        });

    </script>

    <script>

    const whatIfBtn = document.getElementById("whatIfBtn");

    whatIfBtn.addEventListener("click", function () {

        const total =
            Number(document.getElementById("totlectures").value);

        const absent =
            Number(document.getElementById("absent").value);

        const futureAttended =
            Number(document.getElementById("futureAttended").value);

        const futureAbsent =
            Number(document.getElementById("futureAbsent").value);

        const required =
            Number(document.getElementById("required").value);

        const whatIfResult =
            document.getElementById("whatIfResult");


        /* Validation */

        if (total <= 0) {

            whatIfResult.style.display = "block";

            whatIfResult.innerHTML =
                "First calculate your current attendance.";

            return;
        }


        if (futureAttended < 0 || futureAbsent < 0) {

            whatIfResult.style.display = "block";

            whatIfResult.innerHTML =
                "Please enter valid numbers.";

            return;
        }


        /* Current attendance */

        const currentAttended =
            total - absent;


        /* Future situation */

        const newAttended =
            currentAttended + futureAttended;


        const newTotal =
            total + futureAttended + futureAbsent;


        /* New percentage */

        const newPercentage =
            (newAttended / newTotal) * 100;


        whatIfResult.style.display = "block";


        /* Result */

        if (newPercentage >= required) {

            whatIfResult.innerHTML = `

                <h5>
                    📈 Projected Attendance
                </h5>

                <h2>
                    ${newPercentage.toFixed(2)}%
                </h2>

                <p class="mb-0">

                    After attending
                    <strong>${futureAttended}</strong>
                    lecture(s)

                    and missing
                    <strong>${futureAbsent}</strong>
                    lecture(s),

                    your attendance will be

                    <strong>${newPercentage.toFixed(2)}%</strong>.

                </p>

                <div class="alert alert-success mt-3 mb-0">

                    ✓ You will remain above
                    ${required}% attendance.

                </div>

            `;

        } else {

            whatIfResult.innerHTML = `

                <h5>
                    📉 Projected Attendance
                </h5>

                <h2>
                    ${newPercentage.toFixed(2)}%
                </h2>

                <p class="mb-0">

                    After attending
                    <strong>${futureAttended}</strong>
                    lecture(s)

                    and missing
                    <strong>${futureAbsent}</strong>
                    lecture(s),

                    your attendance will be

                    <strong>${newPercentage.toFixed(2)}%</strong>.

                </p>

                <div class="alert alert-danger mt-3 mb-0">

                    ⚠ You will fall below
                    ${required}% attendance.

                </div>

            `;

        }

    });

</script>

</body>

</html>
